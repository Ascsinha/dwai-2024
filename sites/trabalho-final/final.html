<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/global.css">
    <link rel="stylesheet" href="assets/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <title>Trabalho final de Design - Nível Intermediário</title>
</head>

<body>

    <section class="container flex coluna">
        <header class="flex centralizar alinhar-extremidades">
            <img src="assets/img/logo-awe.png" alt="">
            <div class="flex centralizar">
                <div class="flex inscricoes centralizar">
                    <h2>Suspender inscrições</h2>
                    <img src="assets/img/pause-circle.png" alt="">

                <div class="flex usuario centralizar">

                    <div>Clayton</div>
                    <img src="assets/img/chevron-down.png" alt="">

            </div>
        </header>

        <main class="flex">
            <nav class="esquerda flex coluna">
                <div class="flex direita">
                    <img src="assets/img/chevron-left.png" alt="">
                </div>
                <div class="flex coluna alinhar-extremidades esquerda">
                    <div>
                        <a class="flex alinhar-vertical">
                            <figure>
                                <img src="assets/img/dashboard.svg" alt="">
                            </figure>
                            <div>
                                <div>Dashboard</div>
                            </div>
                        </a>
                        <a class="flex alinhar-vertical">
                            <figure>
                                <img src="assets/img/users.svg" alt="">
                            </figure>
                            <div>
                                <div>Inscrições</div>
                            </div>
                        </a>
                        <a class="flex alinhar-vertical">
                            <figure>
                                <img src="assets/img/report.svg" alt="">
                            </figure>
                            <div>
                                <div>Relatórios</div>
                            </div>
                        </a>
                        <a class="flex alinhar-vertical">
                            <figure>
                                <img src="assets/img/send.svg" alt="">
                            </figure>
                            <div>
                                <div>Comunicação</div>
                            </div>
                        </a>
                        <a class="flex alinhar-vertical">
                            <figure>
                                <img src="assets/img/eventos.svg" alt="">
                            </figure>
                            <div>
                                <div>Meus eventos</div>
                            </div>
                        </a>
                    </div>

                    <div>
                        <a class="flex alinhar-vertical">
                            <figure>
                                <img src="assets/img/config.png" alt="">
                            </figure>
                            <div>
                                <div>Configurações</div>
                            </div>
                        </a>
                        <a class="flex alinhar-vertical">
                            <figure>
                                <img src="assets/img/sair.png" alt="">
                            </figure>
                            <div>
                                <div>Sair</div>
                            </div>
                        </a>
                    </div>
                </div>
            </nav>

            <section class="meio">
                <div>
                    <div>
                        <div>
                            <h1></h1>
                            <i class="fa-solid fa-up-right-from-square"></i>
                        </div>
                        <div>
                            <div>
                                <i class="fa-light fa-calendar"></i>
                                <div></div>
                            </div>
                            <div>
                                <i class="fa-light fa-location-dot"></i>
                                <div>IFZN</div>
                            </div>
                            <div>
                                <img src="" alt="">
                                <div>Recebendo Inscrições</div>
                            </div>
                        </div>
                    </div>
                    <div>
                        <img src="" alt="">
                        <div>Editar</div>
                    </div>
                </div>

                <div>
                    <div>
                        <div>
                            <div>
                                <div>
                                    <img src="" alt="">
                                    <h2></h2>
                                </div>
                                <figure>
                                    <img src="" alt="">
                                </figure>
                            </div>
                            <div>
                                <big></big>
                            </div>
                        </div>
                    </div>
                </div>

            </section>

            <section class="direita"></section>
        </main>

    </section>

</html>
